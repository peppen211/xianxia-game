name: Prototype CI

on:
  push:
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-ci.yml'
  pull_request:
    paths:
      - 'prototype/**'
      - '.github/workflows/prototype-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build
