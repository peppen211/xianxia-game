name: Game Browser Test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/game-browser-test.yml'
      - 'v7*.html'
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run mobile flow and capture evidence
        run: |
          mkdir -p evidence
          cat > test.cjs <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const context = await browser.newContext({
              viewport:{width:390,height:844}, deviceScaleFactor:1,
              isMobile:true, hasTouch:true, recordVideo:{dir:'evidence',size:{width:390,height:844}}
            });
            const page = await context.newPage();
            const errors=[];
            page.on('pageerror', e => errors.push(e.message));
            await page.goto('https://peppen211.github.io/xianxia-game/v7.17.html',{waitUntil:'networkidle',timeout:60000});
            await page.screenshot({path:'evidence/01-setup.png',fullPage:true});
            const reserveNamesBefore=await page.locator('#reserveGrid .card .name').allTextContents();
            const reserveCard=page.locator('#reserveGrid .card').first();
            await reserveCard.tap();
            await page.waitForTimeout(500);
            const deployedAfterTap=await page.locator('#activeGrid .card').count();
            if(deployedAfterTap===0) throw new Error('卡牌點擊後沒有進入上場區，需修正卡牌操作');
            const reserveNamesAfter=await page.locator('#reserveGrid .card .name').allTextContents();
            if(reserveNamesBefore.length>1 && reserveNamesAfter[0]!==reserveNamesBefore[1]) throw new Error('備用卡上陣後，後續卡牌沒有依序補位');
            await page.waitForTimeout(400);
            await page.screenshot({path:'evidence/02-card-deployed.png',fullPage:true});
            const dragSource=page.locator('#reserveGrid .card').first();
            const dragTarget=page.locator('#activeGrid .card').first();
            const sourceName=await dragSource.locator('.name').textContent();
            const sb=await dragSource.boundingBox(), tb=await dragTarget.boundingBox();
            await page.mouse.move(sb.x+sb.width/2,sb.y+sb.height/2);
            await page.mouse.down();
            await page.mouse.move(tb.x+tb.width/2,tb.y+tb.height/2,{steps:8});
            await page.mouse.up();
            await page.waitForTimeout(350);
            const activeNames=await page.locator('#activeGrid .card .name').allTextContents();
            if(!activeNames.includes(sourceName)) throw new Error('拖曳卡牌到上場區未成功');
            await page.screenshot({path:'evidence/03-drag-test.png',fullPage:true});
            const deployed=await page.locator('#activeGrid .card').count();
            await page.locator('#stickyStart').tap();
            await page.waitForTimeout(300);
            const underfill=await page.locator('#underfillConfirm').evaluate(el=>el.classList.contains('show')).catch(()=>false);
            if(underfill) await page.locator('#underfillContinue').tap();
            await page.waitForTimeout(3500);
            await page.screenshot({path:'evidence/04-battle.png',fullPage:true});
            await page.waitForFunction(()=>document.querySelector('#result')?.classList.contains('show'),{timeout:70000});
            await page.screenshot({path:'evidence/05-result.png',fullPage:true});
            await page.locator('#result button').first().tap().catch(()=>{});
            await page.waitForTimeout(500);
            await page.screenshot({path:'evidence/06-after-result.png',fullPage:true});
            await context.close();
            await browser.close();
            require('fs').writeFileSync('evidence/test-report.json',JSON.stringify({url:'https://peppen211.github.io/xianxia-game/v7.17.html',deployedActiveCards:deployed,underfillConfirmShown:underfill,pageErrors:errors,checks:['reserve compaction','drag and drop','setup -> battle -> result'],status:errors.length?'CHECK_ERRORS':'COMPLETED'},null,2));
            if(errors.length) process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          EOF
          node test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-browser-test-evidence
          path: evidence/
          retention-days: 14
