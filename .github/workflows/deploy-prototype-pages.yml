name: Test and Deploy Full RPG to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run gameplay tests
        run: npm test
      - name: Build production site
        run: |
          npm run build
          cp index.html dist/index.html
          cp latest.html dist/latest.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser smoke-test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify game renders and starts in a mobile browser
        run: |
          cat > /tmp/game-smoke.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, reducedMotion: 'reduce' });
            const errors = [];
            page.on('pageerror', error => { errors.push(error.message); console.log('BROWSER PAGE ERROR: ' + error.stack); });
            page.on('console', message => { if (message.type() === 'error') { errors.push(message.text()); console.log('BROWSER CONSOLE ERROR: ' + message.text()); } });
            page.on('requestfailed', request => console.log('FAILED REQUEST: ' + request.url() + ' :: ' + request.failure()?.errorText));
            page.on('response', response => { if (response.status() >= 400) console.log('HTTP ERROR: ' + response.status() + ' ' + response.url()); });
            // Use an isolated CI save at the auto-cultivation unlock level so this smoke test
            // can validate the automatic cultivation flow without touching any player save.
            await page.addInitScript(() => localStorage.setItem('mortalCultivationSaveV2', JSON.stringify({
              created: true, name: 'CI 測試道友', root: '四屬性偽靈根', level: 5, xp: 0,
              stones: 10, hp: 100, maxHp: 100, herbs: 0, materials: 0,
              questExplore: 0, questWins: 0, questExploreClaimed: false, questFightClaimed: false,
              cultivating: false, last: Date.now(), log: 'CI smoke test'
            })));
            let rendered = false;
            for (let attempt = 0; attempt < 6; attempt++) {
              await page.goto('https://peppen211.github.io/xianxia-game/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              try {
                await page.locator('#hero').waitFor({ timeout: 8000 });
                rendered = true;
                break;
              } catch {
                console.log('Waiting for published app, attempt ' + (attempt + 1) + '; title=' + await page.title() + '; body=' + (await page.locator('body').innerText()).slice(0, 300) + '; errors=' + errors.join(' | '));
                await page.waitForTimeout(5000);
              }
            }
            if (!rendered) throw new Error('Published game UI did not render after retries.');
            await page.locator('#start').click();
            await page.locator('button[data-tab="cultivate"]').click();
            await page.locator('#cultivateBtn').click();
            await page.getByRole('button', { name: /停止(自動)?修煉/ }).waitFor({ timeout: 10000 });
            await page.locator('#cultivateBtn').click();
            await page.locator('button[data-tab="explore"]').click();
            for (let i = 0; i < 3; i++) await page.locator('#gather').click();
            await page.locator('#claimExplore').waitFor({ state: 'visible' });
            if (await page.locator('#claimExplore').isDisabled()) throw new Error('Explore quest did not unlock after three gathers.');
            await page.locator('#claimExplore').click();
            await page.locator('#openBattle').click();
            await page.locator('#fight').click();
            await page.locator('#fight').click();
            await page.locator('button[data-tab="explore"]').click();
            if (await page.locator('#claimFight').isDisabled()) throw new Error('Battle quest did not unlock after two fights.');
            await page.locator('#claimFight').click();
            await page.locator('button[data-tab="shop"]').click();
            await page.locator('#buyHerbs').click();
            await page.locator('button[data-tab="bag"]').click();
            await page.locator('#rest').waitFor({ timeout: 5000 });
            if (errors.length) throw new Error('Browser console errors: ' + errors.join(' | '));
            console.log('Mobile gameplay flow passed: enter, cultivate, explore, claim quest, battle twice, claim reward, purchase supplies, and open inventory.');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          EOF
          node /tmp/game-smoke.cjs
      - name: Verify published game entry
        run: |
          set -eu
          URL="https://peppen211.github.io/xianxia-game/"
          for attempt in 1 2 3 4 5 6; do
            PAGE="$(curl -fsSL "$URL" || true)"
            if printf "%s" "$PAGE" | grep -q 'id="start"' && printf "%s" "$PAGE" | grep -q 'id="cultivateBtn"' && ! printf "%s" "$PAGE" | grep -q '/src/main.tsx'; then
              echo "Published standalone game entry and core controls verified."
              exit 0
            fi
            sleep 10
          done
          echo "Published page or one of its compiled assets failed verification. Check GitHub Pages source and asset paths." >&2
          exit 1
