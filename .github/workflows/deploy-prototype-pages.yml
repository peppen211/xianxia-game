              if (!legacyResponse.ok()) throw new Error('舊入口沒有回應可用的轉址頁：' + legacyPath + ' (' + legacyResponse.status() + ')');
              const legacyHtml = await legacyResponse.text();
              if (!legacyHtml.includes("https://peppen211.github.io/xianxia-game/?v=6.70") || !legacyHtml.includes('location.replace')) {
                throw new Error('舊入口仍未指向 v6.70 正式版：' + legacyPath);
              }
            }
            await page.goto('https://peppen211.github.io/xianxia-game/classic.html?verify=v6.70', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForFunction(() => location.pathname === '/xianxia-game/' && location.search === '?v=6.70', null, { timeout: 15000 });
            await page.locator('#launchGate').waitFor({ state: 'visible', timeout: 15000 });
            await page.locator('#continueCultivationBtn').click();
            await page.locator('#gameApp').waitFor({ state: 'visible', timeout: 5000 });
            const legacyTargetVersion = (await page.locator('#gameApp .status-version').innerText()).trim();
            if (legacyTargetVersion !== 'v6.70') throw new Error('舊版入口轉址後仍未開啟 v6.70：' + legacyTargetVersion);
            console.log('Legacy entry regression passed: classic, both old mortal-cultivation pages, and prototype/index.html redirect to v6.70 without launching old save logic.');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
