name: Test and Deploy Full RPG to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: full-rpg-deployment
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run gameplay tests
        run: npm test
      - name: Build production site
        run: |
          npm run build
          cp index.html dist/index.html
          cp latest.html dist/latest.html
          cp '首頁.PNG' 'dist/首頁.PNG'
          LEGACY_REDIRECT_HTML='<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,follow"><meta http-equiv="refresh" content="0;url=https://peppen211.github.io/xianxia-game/?v=6.70"><title>遊戲版本已更新｜不好意思，本座又突破了</title><script>window.location.replace("https://peppen211.github.io/xianxia-game/?v=6.70");</script></head><body><p>這個舊入口已併入目前正式版，正在前往 v6.70。</p><a href="https://peppen211.github.io/xianxia-game/?v=6.70">開啟目前正式版 v6.70</a></body></html>'
          for LEGACY_PATH in classic.html mortal-cultivation-rpg.html mortal-cultivation-rpg-3.3.html; do
            printf '%s\n' "$LEGACY_REDIRECT_HTML" > "dist/$LEGACY_PATH"
          done
          mkdir -p dist/prototype
          printf '%s\n' "$LEGACY_REDIRECT_HTML" > dist/prototype/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser smoke-test tools
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Verify launch gate and entry flow in a mobile browser
        run: |
          cat > /tmp/game-smoke.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, reducedMotion: 'reduce' });
            const errors = [];
            page.on('pageerror', error => { errors.push(error.message); console.log('BROWSER PAGE ERROR: ' + error.stack); });
            page.on('console', message => { if (message.type() === 'error') { errors.push(message.text()); console.log('BROWSER CONSOLE ERROR: ' + message.text()); } });
            page.on('response', response => { if (response.status() >= 400) console.log('BROWSER HTTP ERROR: ' + response.status() + ' ' + response.url()); });
            page.on('requestfailed', request => console.log('BROWSER REQUEST FAILED: ' + request.url() + ' :: ' + (request.failure()?.errorText || 'unknown')));

            await page.goto('https://peppen211.github.io/xianxia-game/?v=6.70', { waitUntil: 'domcontentloaded', timeout: 60000 });
            const gate = page.locator('#launchGate');
            const app = page.locator('#gameApp');
            const continueButton = page.locator('#continueCultivationBtn');

            await gate.waitFor({ state: 'visible', timeout: 15000 });
            await continueButton.waitFor({ state: 'visible', timeout: 5000 });
            const launchLabel = (await continueButton.locator('.continue-label').innerText().catch(() => continueButton.innerText())).trim();
            if (!['繼續修煉', '開始修行'].includes(launchLabel)) {
              throw new Error('Launch gate button label is missing or incorrect: ' + launchLabel);
            }
            if (await app.isVisible()) throw new Error('Main game is visible before the player enters.');
            if (!(await page.locator('body').evaluate(el => el.classList.contains('launch-gate')))) {
              throw new Error('Fresh page did not start in launch-gate state.');
            }

            await continueButton.click();
            await app.waitFor({ state: 'visible', timeout: 5000 });
            await gate.waitFor({ state: 'hidden', timeout: 5000 });
            if (await page.locator('body').evaluate(el => el.classList.contains('launch-gate'))) {
              throw new Error('Launch-gate state remained after clicking continue.');
            }
            const publishedVersionLabel = await page.locator('#gameApp .status-version').evaluate(el => el.textContent.trim());
            if (publishedVersionLabel !== 'v6.70') throw new Error('遊戲右上角版本標示應為 v6.70，實際為：' + publishedVersionLabel);
            await page.locator('#gameApp .bottom .nav[data-screen="cultivate"]').click();
            await page.locator('#cultivate.active').waitFor({state:'visible', timeout:3000});
            const catalogEntryAudit = await page.locator('#cultivate').evaluate(el => ({
              duplicateCatalogButton: !!el.querySelector('#openCultivateCatalog'),
              duplicateCatalogPanel: !!el.querySelector('.panel:has(#openCultivateCatalog)'),
              oldInnerPages: el.querySelectorAll('#cultivatePracticeView, #cultivateMethodsView, [data-cultivate-tab]').length
            }));
            if (catalogEntryAudit.duplicateCatalogButton || catalogEntryAudit.duplicateCatalogPanel || catalogEntryAudit.oldInnerPages !== 0) {
              throw new Error('仙途頁不應重複顯示典藏圖鑑，且舊修煉子頁應已移除：' + JSON.stringify(catalogEntryAudit));
            }

            await page.locator('#gameApp .bottom .nav[data-screen="bag"]').click();
            await page.locator('#bag.active').waitFor({state:'visible', timeout:3000});
            await page.locator('#bag .bag-catalog-button').waitFor({state:'visible', timeout:3000});
            const bagCategoryKeys = await page.locator('#bag [data-bag-main-tab]').evaluateAll(nodes => nodes.map(node => node.getAttribute('data-bag-main-tab')));
            if (!['equipment','treasures','magic','pets','materials'].every(key => bagCategoryKeys.includes(key))) {
              throw new Error('儲物袋五大分類缺失：' + JSON.stringify(bagCategoryKeys));
            }
            await page.locator('#bag .bag-catalog-button').click();
            await page.locator('#uiModal').waitFor({state:'visible', timeout:5000});
            const catalogTabs = page.locator('#uiModal .catalog-category-tabs button');
            await catalogTabs.nth(1).click();
            if (await catalogTabs.nth(1).getAttribute('aria-selected') !== 'true') {
              throw new Error('分類圖鑑按鈕無法切換至古寶類。');
            }
            await page.locator('#uiModal .modal-close').click();
            await page.locator('#uiModal').waitFor({state:'hidden', timeout:3000});

            await page.locator('#gameApp .bottom .nav[data-screen="home"]').click();
            await page.locator('#home.active').waitFor({state:'visible', timeout:3000});
            const battlePlayerStatus = page.locator('#battlePlayerStatus');
            if (!(await battlePlayerStatus.isVisible())) throw new Error('切換至試煉首頁後，戰鬥介面缺少可見的修士氣血狀態列。');
            const combatStatusAudit = await page.evaluate(() => ({
              hpText:document.querySelector('#playerHpText')?.textContent.trim(),
              hpWidth:parseFloat(document.querySelector('#playerHpBar')?.style.width || '0'),
              hpNow:document.querySelector('#battlePlayerStatus .player-hp-progress')?.getAttribute('aria-valuenow'),
              stats:document.querySelector('#playerCombatStats')?.textContent || '',
              ready:document.querySelector('#battleReadyTag')?.textContent || '',
              enemyStats:document.querySelector('#battleEnemyStats')?.textContent.trim() || ''
            }));
            if (!combatStatusAudit.hpText || !combatStatusAudit.stats.includes('攻擊') || !combatStatusAudit.stats.includes('防禦') ||
                !combatStatusAudit.ready || !combatStatusAudit.enemyStats.includes('基礎獎勵') || !combatStatusAudit.enemyStats.includes('攻擊') || combatStatusAudit.hpWidth <= 0 || combatStatusAudit.hpNow === null) {
              throw new Error('戰鬥介面角色氣血／戰力資訊不完整：' + JSON.stringify(combatStatusAudit));
            }
            console.log('Battle UI regression passed: player HP bar, accessible HP progress, combat stats, readiness warning, and enemy attack/defense/reward details are visible.');
            const characterHeadingDisplay = await page.locator('#character > .page-title').evaluate(el => getComputedStyle(el).display);
            if (characterHeadingDisplay !== 'none') throw new Error('角色分頁的「修士面板」標題列應已移除。');
            const topLevelCultivationHeadingCount = await page.locator('#cultivate > .page-title').count();
            if (topLevelCultivationHeadingCount !== 0) throw new Error('Cultivation headings must stay inside their own sub-tabs.');
            await page.locator('#gameApp .bottom .nav[data-screen="cultivate"]').click();
            await page.locator('#cultivate.active').waitFor({state:'visible', timeout:3000});

            // The cultivation screen intentionally has no duplicate archive entry; the catalog is opened from the inventory bag.
            await page.locator('#gameApp .bottom .nav[data-screen="cultivate"]').click();
            await page.locator('#cultivate.active').waitFor({state:'visible', timeout:3000});
            const catalogOnlyAudit = await page.locator('#cultivate').evaluate(el => ({
              duplicateCatalogButton: !!el.querySelector('#openCultivateCatalog'),
              duplicateCatalogPanel: !!el.querySelector('.panel:has(#openCultivateCatalog)'),
              oldInnerPages: el.querySelectorAll('#cultivatePracticeView, #cultivateMethodsView, [data-cultivate-tab]').length
            }));
            if (catalogOnlyAudit.duplicateCatalogButton || catalogOnlyAudit.duplicateCatalogPanel || catalogOnlyAudit.oldInnerPages !== 0) {
              throw new Error('仙途典藏入口重複或舊修煉子頁未移除：' + JSON.stringify(catalogOnlyAudit));
            }

            await page.evaluate(() => openBreakthroughModal());
            const breakthroughModalForCatalogOnly = page.locator('#uiModal');
            await breakthroughModalForCatalogOnly.waitFor({state:'visible', timeout:5000});
            const breakthroughTextForCatalogOnly = await page.locator('#modalBody').innerText();
            if (!breakthroughTextForCatalogOnly.includes('靈石') || !breakthroughTextForCatalogOnly.includes('靈草')) {
              throw new Error('精簡仙途後，突破彈窗仍須保留靈石與靈草需求。');
            }
            await page.locator('#uiModal .modal-close').click();
            await breakthroughModalForCatalogOnly.waitFor({state:'hidden', timeout:3000});

            // Regression tests for the shop use only this isolated browser save.
            await page.locator('#gameApp .bottom .nav[data-screen="shop"]').click();
            if (!(await page.locator('#shop').isVisible())) throw new Error('無法開啟仙市頁面。');
            await page.evaluate(() => {
              window.__shopSaveSnapshot = JSON.parse(JSON.stringify(s));
              s.gold = 500;
              s.pills = 0;
              s.wood = 0;
              s.crystal = 0;
              save();
              render();
            });
            try {
              await page.locator('#buyPill').click();
              await page.locator('#buyPill5').click();
              await page.locator('#buyWood5').click();
              await page.locator('#buyCrystal1').click();
              const purchased = await page.evaluate(() => ({
                gold:Number(s.gold),pills:Number(s.pills),wood:Number(s.wood),crystal:Number(s.crystal),
                shownGold:document.querySelector('#shopGold')?.textContent.trim(),
                shownPills:document.querySelector('#shopPillCount')?.textContent.trim(),
                shownWood:document.querySelector('#shopWoodCount')?.textContent.trim(),
                shownCrystal:document.querySelector('#shopCrystalCount')?.textContent.trim()
              }));
              if (purchased.gold !== 215 || purchased.pills !== 6 || purchased.wood !== 5 || purchased.crystal !== 1 ||
                  purchased.shownGold !== '215' || purchased.shownPills !== '6' || purchased.shownWood !== '5' || purchased.shownCrystal !== '1') {
                throw new Error('仙市購買扣款或庫存入帳不正確：' + JSON.stringify(purchased));
              }
              await page.evaluate(() => { s.gold = 0; save(); render(); });
              if (!(await page.locator('#buyCrystal5').isDisabled()) || !(await page.locator('#buyPill').isDisabled())) {
                throw new Error('靈石不足時，仙市購買按鈕應自動禁用。');
              }
              const beforeInsufficient = await page.evaluate(() => ({gold:Number(s.gold),pills:Number(s.pills),wood:Number(s.wood),crystal:Number(s.crystal)}));
              await page.evaluate(() => { buyPill(); window.buyShopBundle('crystal',5,30,'靈晶'); });
              const afterInsufficient = await page.evaluate(() => ({gold:Number(s.gold),pills:Number(s.pills),wood:Number(s.wood),crystal:Number(s.crystal)}));
              if (JSON.stringify(afterInsufficient) !== JSON.stringify(beforeInsufficient)) {
                throw new Error('靈石不足時的交易不應改動任何資源：' + JSON.stringify({before:beforeInsufficient,after:afterInsufficient}));
              }
              console.log('Shop purchase regression passed: single and bundle purchases, exact costs, live inventory totals, disabled unaffordable buttons and no-funds transaction safety.');
            } finally {
              await page.evaluate(() => {
                const snapshot = window.__shopSaveSnapshot;
                if (snapshot) {
                  Object.keys(s).forEach(key => delete s[key]);
                  Object.assign(s,snapshot);
                  delete window.__shopSaveSnapshot;
                  save();
                  render();
                }
              });
            }

            // Economy audit: validate the existing income/cost relationships without changing player resources or balance values.
            const economyAudit = await page.evaluate(() => {
              return {
                initialGold: GAME_CONFIG.initial.gold,
                initialHerbs: GAME_CONFIG.initial.herbs,
                breakthrough: GAME_CONFIG.breakthrough,
                firstFiveEnemyGold: foes.map(foe => foe.gold),
                firstFiveGoldTotal: foes.reduce((sum, foe) => sum + foe.gold, 0),
                firstUpgradeCosts: {attack:35+15,defense:30+13,maxHp:40+18},
                methodUnlockCosts: GAME_CONFIG.methods.map(method => method.cost),
                tierCosts: {xp2:methodTierCost(0,2).gold,xp5:methodTierCost(0,5).gold,xp10:methodTierCost(0,10).gold,defense10:methodTierCost(2,10).gold},
                shopUnitPrices:{pill:30,wood:15,crystal:30},
                shopBundles:{pill5:150,wood5:75,crystal5:150},
                craftRecipes:{staff:{wood:3,crystal:2},robe:{wood:2,crystal:3},charm:{wood:1,crystal:4}}
              };
            });
            if (economyAudit.initialGold !== 100 || economyAudit.initialHerbs !== 3 ||
                economyAudit.breakthrough.goldCost !== 50 || economyAudit.breakthrough.herbCost !== 1 ||
                JSON.stringify(economyAudit.firstFiveEnemyGold) !== JSON.stringify([12,18,25,36,52]) ||
                economyAudit.firstFiveGoldTotal !== 143 ||
                JSON.stringify(economyAudit.firstUpgradeCosts) !== JSON.stringify({attack:50,defense:43,maxHp:58}) ||
                JSON.stringify(economyAudit.methodUnlockCosts) !== JSON.stringify([0,80,120]) ||
                economyAudit.tierCosts.xp2 !== 45 || economyAudit.tierCosts.xp5 !== 105 ||
                economyAudit.tierCosts.xp10 !== 205 || economyAudit.tierCosts.defense10 !== 225 ||
                JSON.stringify(economyAudit.shopUnitPrices) !== JSON.stringify({pill:30,wood:15,crystal:30}) ||
                JSON.stringify(economyAudit.shopBundles) !== JSON.stringify({pill5:150,wood5:75,crystal5:150})) {
              throw new Error('經濟關鍵數值與預期不一致：' + JSON.stringify(economyAudit));
            }
            console.log('Economy balance audit passed: starting funds, first five enemy rewards, breakthrough and upgrade sinks, method progression costs, shop prices, bundles and crafting recipes are consistent.');

            // Regression checks for v0.97 equipment inventory. Fixtures exist only in this isolated browser profile.
            await page.locator('#gameApp .bottom .nav[data-screen="bag"]').click();
            const bag = page.locator('#bag');
            const mainTabs = bag.locator('[data-bag-main-tab]');
            const equipTabs = bag.locator('[data-bag-category]');
            if (await mainTabs.count() !== 5) throw new Error('儲物袋應有裝備類、古寶類、靈寵類、法寶類、材料類五個主分類。');
            const mainTabColumns = await mainTabs.first().evaluate(el => getComputedStyle(el.parentElement).gridTemplateColumns.trim().split(' ').filter(Boolean).length);
            if (mainTabColumns !== 5) throw new Error('儲物袋五大分類按鈕應在同一列呈現五欄，實際欄數：' + mainTabColumns);
            if (await equipTabs.count() !== 4) throw new Error('裝備分類應有全部、武器、防具、飾品四個子分類。');

            // v4.3 regression: material stack counts, inventory view and non-destructive save migration.
            await bag.locator('[data-bag-main-tab="materials"]').click();
            const materialCards = bag.locator('.bag-material-card');
            if (await materialCards.count() !== 10) throw new Error('材料袋應顯示 10 種材料，其中含 8 種基礎材料與金雷竹、庚精。');
            const materialNames = await materialCards.locator('.bag-material-info b').allTextContents();
            const expectedMaterials = ['靈木','精鐵','靈布','妖獸皮','妖獸骨','低階靈晶','凝氣草','符紙','金雷竹','庚精'];
            if (JSON.stringify(materialNames) !== JSON.stringify(expectedMaterials)) throw new Error('材料袋名稱或順序不正確：' + JSON.stringify(materialNames));
            const materialCounts = await page.evaluate(() => ({
              legacy:{wood:Number(s.wood),crystal:Number(s.crystal),herbs:Number(s.herbs)},
              newMaterials:Object.keys(s.craftingMaterials || {}).sort(),
              allNonNegative:QI_CRAFTING_MATERIALS.every(item => {
                const n=item.key==='wood'?s.wood:item.key==='crystal'?s.crystal:item.key==='qiHerb'?s.herbs:s.craftingMaterials[item.key];
                return Number.isFinite(Number(n)) && Number(n)>=0;
              })
            }));
            if (!materialCounts.allNonNegative || JSON.stringify(materialCounts.newMaterials) !== JSON.stringify(['beastBone','beastHide','cloth','gengEssence','goldThunderBamboo','iron','talismanPaper'])) throw new Error('材料數量或存檔欄位不正確：' + JSON.stringify(materialCounts));
            await bag.locator('[data-bag-main-tab="equipment"]').click();
            console.log('Qi Refining materials regression passed: ten material cards including eight base types and two rare materials, legacy resources reused without reset.');

            // v6.25 regression: blood-jade spider's material-drop bonus must affect the five stackable crafting materials, not only legacy wood/crystal.
            const craftingDropPerkAudit = await page.evaluate(() => {
              const snapshot = JSON.parse(JSON.stringify(s));
              const previousEnemy = enemy;
              const originalRandom = Math.random;
              try {
                s.ownedPets = [{id:'blood-jade-spider',level:5}];
                s.ownedTreasures = [];
                s.magicTreasures = [];
                s.activeMagicTreasure = null;
                s.activeMagicTreasure2 = null;
                s.craftingMaterials = {iron:0,cloth:0,beastHide:0,beastBone:0,talismanPaper:0};
                s.wood = 0; s.crystal = 0; s.herbs = 0; s.pills = 0;
                enemy = {name:'材料掉落加成測試妖獸',type:'普通',gold:0,xp:0,def:0};
                Math.random = () => 0.2;
                win();
                return {
                  bonusDrop:gearPerks().bonusDrop,
                  iron:s.craftingMaterials.iron,
                  hide:s.craftingMaterials.beastHide,
                  legacyWood:s.wood,
                  legacyCrystal:s.crystal
                };
              } finally {
                Math.random = originalRandom;
                Object.keys(s).forEach(key => delete s[key]);
                Object.assign(s, snapshot);
                enemy = previousEnemy;
                save();
                render();
              }
            });
            if (craftingDropPerkAudit.bonusDrop < 0.099 ||
                craftingDropPerkAudit.iron !== 1 ||
                craftingDropPerkAudit.hide !== 1) {
              throw new Error('靈寵材料掉落加成未作用於堆疊煉器材料：' + JSON.stringify(craftingDropPerkAudit));
            }
            console.log('Crafting material drop-perk regression passed: pet material-drop bonuses affect iron, cloth, beast hide, beast bone and talisman paper chances.');

            // v4.3 regression: all twelve Qi Refining recipes render, insufficient materials never consume resources, and successful crafting deducts the exact recipe and adds gear.
            const forgeRecipeAudit = await page.evaluate(() => {
              const snapshot = JSON.parse(JSON.stringify(s));
              try {
                renderQiRecipeCards();
                const rendered = document.querySelectorAll('#qiStarterRecipes .qi-recipe-card').length;
                const starterTemplates = QI_GEAR_RECIPES.map(recipe => gears.find(item => item.qiStarter && item.name === recipe.name));
                const templateIds = starterTemplates.map(item => item && item.templateId);
                const firstBatchNames = ['青竹劍','粗布護衣','獸皮護腕','獸骨短刀','凝氣玉佩','藤編護腿','磨石短劍','獸牙項鍊','靈木法杖','聚氣符囊'];
                const firstBatchCount = gears.filter(item => item.qiStarter && item.starterBatch === 1).length;
                const firstBatchComplete = firstBatchNames.every(name => {
                  const item = starterTemplates.find(candidate => candidate && candidate.name === name);
                  return !!item && item.starterBatch === 1 && QI_GEAR_RECIPES.some(recipe => recipe.name === name);
                });
                const expectedFirstBatchMaterials = {
                  '青竹劍':'wood',
                  '粗布護衣':'cloth',
                  '獸皮護腕':'beastHide',
                  '獸骨短刀':'beastBone',
                  '凝氣玉佩':'crystal',
                  '藤編護腿':'wood',
                  '磨石短劍':'iron',
                  '獸牙項鍊':'beastBone',
                  '靈木法杖':'wood',
                  '聚氣符囊':'talismanPaper'
                };
                const firstBatchMaterialMap = firstBatchNames.every(name => {
                  const item = starterTemplates.find(candidate => candidate && candidate.name === name);
                  return !!item && item.enhanceMaterialKey === expectedFirstBatchMaterials[name];
                });
                const metadataComplete = starterTemplates.length === 20 && starterTemplates.every(item =>
                  item && item.templateId && Number(item.gearLevel) >= 1 && item.realmRequirement === '煉氣期' &&
                  item.enhanceMaterialKey && item.dataSource === '遊戲原創' && item.acquisition && item.dropSource
                );
                const templateIdsUnique = new Set(templateIds).size === 20 && templateIds.every(Boolean);
                s.craftingMaterials = {iron:0,cloth:0,beastHide:0,beastBone:0,talismanPaper:0};
                s.wood = 0; s.crystal = 0; s.herbs = 0;
                // Normalize the material map before taking the no-cost baseline.
                // craftQiGear also normalizes legacy saves; that compatibility step must not be mistaken for a resource deduction.
                ensureCraftingMaterials();
                const beforeInsufficient = JSON.stringify({inventory:s.inventory,materials:s.craftingMaterials,wood:s.wood,crystal:s.crystal,herbs:s.herbs});
                const denied = craftQiGear('護身軟甲');
                const afterInsufficient = JSON.stringify({inventory:s.inventory,materials:s.craftingMaterials,wood:s.wood,crystal:s.crystal,herbs:s.herbs});
                s.craftingMaterials.iron = 2;
                s.craftingMaterials.beastBone = 1;
                const beforeCount = s.inventory.filter(item => item.name === '精鐵劍').length;
                const beforeIron = s.craftingMaterials.iron;
                const beforeBone = s.craftingMaterials.beastBone;
                const crafted = craftQiGear('精鐵劍');
                const afterCount = s.inventory.filter(item => item.name === '精鐵劍').length;
                return {
                  rendered,
                  metadataComplete,
                  templateIdsUnique,
                  firstBatchCount,
                  firstBatchComplete,
                  firstBatchMaterialMap,
                  insufficientDenied: denied === false,
                  insufficientNoCost: beforeInsufficient === afterInsufficient,
                  crafted,
                  addedExactlyOne: afterCount === beforeCount + 1,
                  ironConsumedExactly: beforeIron - s.craftingMaterials.iron === 2,
                  boneConsumedExactly: beforeBone - s.craftingMaterials.beastBone === 1
                };
              } finally {
                s = Object.assign(base(), snapshot);
                render();
              }
            });
            if (forgeRecipeAudit.rendered !== 20 || !forgeRecipeAudit.metadataComplete || !forgeRecipeAudit.templateIdsUnique ||
                forgeRecipeAudit.firstBatchCount !== 10 || !forgeRecipeAudit.firstBatchComplete ||
                !forgeRecipeAudit.firstBatchMaterialMap ||
                !forgeRecipeAudit.insufficientDenied || !forgeRecipeAudit.insufficientNoCost ||
