name: Test and Deploy Full RPG to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run gameplay tests
        run: npm test
      - name: Build production site
        run: |
          npm run build
          cp index.html dist/index.html
          cp latest.html dist/latest.html
          cp '首頁.PNG' 'dist/首頁.PNG'
          LEGACY_REDIRECT_HTML='<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,follow"><meta http-equiv="refresh" content="0;url=https://peppen211.github.io/xianxia-game/?v=2.6"><title>遊戲版本已更新｜不好意思，本座又突破了</title><script>window.location.replace("https://peppen211.github.io/xianxia-game/?v=2.6");</script></head><body><p>這個舊入口已併入目前正式版，正在前往 v2.7。</p><a href="https://peppen211.github.io/xianxia-game/?v=2.6">開啟目前正式版 v2.7</a></body></html>'
          for LEGACY_PATH in classic.html mortal-cultivation-rpg.html mortal-cultivation-rpg-3.3.html; do
            printf '%s\n' "$LEGACY_REDIRECT_HTML" > "dist/$LEGACY_PATH"
          done
          mkdir -p dist/prototype
          printf '%s\n' "$LEGACY_REDIRECT_HTML" > dist/prototype/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser smoke-test tools
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Verify launch gate and entry flow in a mobile browser
        run: |
          cat > /tmp/game-smoke.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, reducedMotion: 'reduce' });
            const errors = [];
            page.on('pageerror', error => { errors.push(error.message); console.log('BROWSER PAGE ERROR: ' + error.stack); });
            page.on('console', message => { if (message.type() === 'error') { errors.push(message.text()); console.log('BROWSER CONSOLE ERROR: ' + message.text()); } });
            page.on('response', response => { if (response.status() >= 400) console.log('BROWSER HTTP ERROR: ' + response.status() + ' ' + response.url()); });
            page.on('requestfailed', request => console.log('BROWSER REQUEST FAILED: ' + request.url() + ' :: ' + (request.failure()?.errorText || 'unknown')));

            await page.goto('https://peppen211.github.io/xianxia-game/?v=2.6', { waitUntil: 'domcontentloaded', timeout: 60000 });
            const gate = page.locator('#launchGate');
            const app = page.locator('#gameApp');
            const continueButton = page.locator('#continueCultivationBtn');

            await gate.waitFor({ state: 'visible', timeout: 15000 });
            await continueButton.waitFor({ state: 'visible', timeout: 5000 });
            const launchLabel = (await continueButton.locator('.continue-label').innerText().catch(() => continueButton.innerText())).trim();
            if (!['繼續修煉', '開始修行'].includes(launchLabel)) {
              throw new Error('Launch gate button label is missing or incorrect: ' + launchLabel);
            }
            if (await app.isVisible()) throw new Error('Main game is visible before the player enters.');
            if (!(await page.locator('body').evaluate(el => el.classList.contains('launch-gate')))) {
              throw new Error('Fresh page did not start in launch-gate state.');
            }

            await continueButton.click();
            await app.waitFor({ state: 'visible', timeout: 5000 });
            await gate.waitFor({ state: 'hidden', timeout: 5000 });
            if (await page.locator('body').evaluate(el => el.classList.contains('launch-gate'))) {
              throw new Error('Launch-gate state remained after clicking continue.');
            }
            const publishedVersionLabel = await page.locator('#gameApp .status-version').evaluate(el => el.textContent.trim());
            if (publishedVersionLabel !== 'v2.7') throw new Error('遊戲右上角版本標示應為 v2.7，實際為：' + publishedVersionLabel);
            const characterHeadingDisplay = await page.locator('#character > .page-title').evaluate(el => getComputedStyle(el).display);
            if (characterHeadingDisplay !== 'none') throw new Error('角色分頁的「修士面板」標題列應已移除。');
            const cultivationHeadingDisplay = await page.locator('#cultivate > .page-title').evaluate(el => getComputedStyle(el).display);
            if (cultivationHeadingDisplay !== 'none') throw new Error('修煉分頁的「修煉洞府」標題列應已移除。');

            // Mobile regression checks for cultivation content.
            const methodCards = page.locator('#cultivate #methodList > .method-card');
            await methodCards.first().waitFor({ state: 'visible', timeout: 5000 });
            if (await methodCards.count() !== 3) throw new Error('Expected three cultivation method cards to be visible.');
            if (!(await page.locator('#breakMaterialSummary').isVisible())) throw new Error('Breakthrough material requirements are missing.');
            if (!(await page.locator('#idleProgressPanel').isVisible())) throw new Error('Idle cultivation progress panel is missing.');
            if (await page.locator('#cultivate > .hero .cultivator').isVisible()) throw new Error('Legacy cultivation illustration should be hidden in the compact guide.');

            await methodCards.first().locator('.method-details-button').click();
            const modal = page.locator('#uiModal');
            await modal.waitFor({ state: 'visible', timeout: 5000 });
            if (!(await page.locator('#modalBody').innerText()).includes('實際效果')) throw new Error('Method detail content did not open.');
            await page.locator('#uiModal .modal-close').click();
            await modal.waitFor({ state: 'hidden', timeout: 3000 });

            await page.locator('#breakBtn').click();
            await modal.waitFor({ state: 'visible', timeout: 5000 });
            const breakthroughText = await page.locator('#modalBody').innerText();
            if (!breakthroughText.includes('靈石') || !breakthroughText.includes('靈草')) throw new Error('Breakthrough dialog must show required materials.');
            await page.locator('#uiModal .modal-close').click();
            await modal.waitFor({ state: 'hidden', timeout: 3000 });

            // Regression tests for the shop use only this isolated browser save.
            await page.locator('#gameApp .bottom .nav[data-screen="shop"]').click();
            if (!(await page.locator('#shop').isVisible())) throw new Error('無法開啟仙市頁面。');
            await page.evaluate(() => {
              window.__shopSaveSnapshot = JSON.parse(JSON.stringify(s));
              s.gold = 500;
              s.pills = 0;
              s.wood = 0;
              s.crystal = 0;
              save();
              render();
            });
            try {
              await page.locator('#buyPill').click();
              await page.locator('#buyPill5').click();
              await page.locator('#buyWood5').click();
              await page.locator('#buyCrystal1').click();
              const purchased = await page.evaluate(() => ({
                gold:Number(s.gold),pills:Number(s.pills),wood:Number(s.wood),crystal:Number(s.crystal),
                shownGold:document.querySelector('#shopGold')?.textContent.trim(),
                shownPills:document.querySelector('#shopPillCount')?.textContent.trim(),
                shownWood:document.querySelector('#shopWoodCount')?.textContent.trim(),
                shownCrystal:document.querySelector('#shopCrystalCount')?.textContent.trim()
              }));
              if (purchased.gold !== 215 || purchased.pills !== 6 || purchased.wood !== 5 || purchased.crystal !== 1 ||
                  purchased.shownGold !== '215' || purchased.shownPills !== '6' || purchased.shownWood !== '5' || purchased.shownCrystal !== '1') {
                throw new Error('仙市購買扣款或庫存入帳不正確：' + JSON.stringify(purchased));
              }
              await page.evaluate(() => { s.gold = 0; save(); render(); });
              if (!(await page.locator('#buyCrystal5').isDisabled()) || !(await page.locator('#buyPill').isDisabled())) {
                throw new Error('靈石不足時，仙市購買按鈕應自動禁用。');
              }
              const beforeInsufficient = await page.evaluate(() => ({gold:Number(s.gold),pills:Number(s.pills),wood:Number(s.wood),crystal:Number(s.crystal)}));
              await page.evaluate(() => { buyPill(); window.buyShopBundle('crystal',5,30,'靈晶'); });
              const afterInsufficient = await page.evaluate(() => ({gold:Number(s.gold),pills:Number(s.pills),wood:Number(s.wood),crystal:Number(s.crystal)}));
              if (JSON.stringify(afterInsufficient) !== JSON.stringify(beforeInsufficient)) {
                throw new Error('靈石不足時的交易不應改動任何資源：' + JSON.stringify({before:beforeInsufficient,after:afterInsufficient}));
              }
              console.log('Shop purchase regression passed: single and bundle purchases, exact costs, live inventory totals, disabled unaffordable buttons and no-funds transaction safety.');
            } finally {
              await page.evaluate(() => {
                const snapshot = window.__shopSaveSnapshot;
                if (snapshot) {
                  Object.keys(s).forEach(key => delete s[key]);
                  Object.assign(s,snapshot);
                  delete window.__shopSaveSnapshot;
                  save();
                  render();
                }
              });
            }

            // Economy audit: validate the existing income/cost relationships without changing player resources or balance values.
            const economyAudit = await page.evaluate(() => {
              return {
                initialGold: GAME_CONFIG.initial.gold,
                initialHerbs: GAME_CONFIG.initial.herbs,
                breakthrough: GAME_CONFIG.breakthrough,
                firstFiveEnemyGold: foes.map(foe => foe.gold),
                firstFiveGoldTotal: foes.reduce((sum, foe) => sum + foe.gold, 0),
                firstUpgradeCosts: {attack:35+15,defense:30+13,maxHp:40+18},
                methodUnlockCosts: GAME_CONFIG.methods.map(method => method.cost),
                tierCosts: {xp2:methodTierCost(0,2).gold,xp5:methodTierCost(0,5).gold,xp10:methodTierCost(0,10).gold,defense10:methodTierCost(2,10).gold},
                shopUnitPrices:{pill:30,wood:15,crystal:30},
                shopBundles:{pill5:150,wood5:75,crystal5:150},
                craftRecipes:{staff:{wood:3,crystal:2},robe:{wood:2,crystal:3},charm:{wood:1,crystal:4}}
              };
            });
            if (economyAudit.initialGold !== 100 || economyAudit.initialHerbs !== 3 ||
                economyAudit.breakthrough.goldCost !== 50 || economyAudit.breakthrough.herbCost !== 1 ||
                JSON.stringify(economyAudit.firstFiveEnemyGold) !== JSON.stringify([12,18,25,36,52]) ||
                economyAudit.firstFiveGoldTotal !== 143 ||
                JSON.stringify(economyAudit.firstUpgradeCosts) !== JSON.stringify({attack:50,defense:43,maxHp:58}) ||
                JSON.stringify(economyAudit.methodUnlockCosts) !== JSON.stringify([0,80,120]) ||
                economyAudit.tierCosts.xp2 !== 45 || economyAudit.tierCosts.xp5 !== 105 ||
                economyAudit.tierCosts.xp10 !== 205 || economyAudit.tierCosts.defense10 !== 225 ||
                JSON.stringify(economyAudit.shopUnitPrices) !== JSON.stringify({pill:30,wood:15,crystal:30}) ||
                JSON.stringify(economyAudit.shopBundles) !== JSON.stringify({pill5:150,wood5:75,crystal5:150})) {
              throw new Error('經濟關鍵數值與預期不一致：' + JSON.stringify(economyAudit));
            }
            console.log('Economy balance audit passed: starting funds, first five enemy rewards, breakthrough and upgrade sinks, method progression costs, shop prices, bundles and crafting recipes are consistent.');

            // Regression checks for v0.97 equipment inventory. Fixtures exist only in this isolated browser profile.
            await page.locator('#gameApp .bottom .nav[data-screen="bag"]').click();
            const bag = page.locator('#bag');
            const mainTabs = bag.locator('[data-bag-main-tab]');
            const equipTabs = bag.locator('[data-bag-category]');
            if (await mainTabs.count() !== 5) throw new Error('儲物袋應有裝備類、古寶類、靈寵類、法寶類、材料類五個主分類。');
            const mainTabColumns = await mainTabs.first().evaluate(el => getComputedStyle(el.parentElement).gridTemplateColumns.trim().split(' ').filter(Boolean).length);
            if (mainTabColumns !== 5) throw new Error('儲物袋五大分類按鈕應在同一列呈現五欄，實際欄數：' + mainTabColumns);
            if (await equipTabs.count() !== 4) throw new Error('裝備分類應有全部、武器、防具、飾品四個子分類。');

            // v2.7 regression: material stack counts, inventory view and non-destructive save migration.
            await bag.locator('[data-bag-main-tab="materials"]').click();
            const materialCards = bag.locator('.bag-material-card');
            if (await materialCards.count() !== 8) throw new Error('材料袋應顯示 8 種煉氣期基礎材料。');
            const materialNames = await materialCards.locator('.bag-material-info b').allTextContents();
            const expectedMaterials = ['靈木','精鐵','靈布','妖獸皮','妖獸骨','低階靈晶','凝氣草','符紙'];
            if (JSON.stringify(materialNames) !== JSON.stringify(expectedMaterials)) throw new Error('材料袋名稱或順序不正確：' + JSON.stringify(materialNames));
            const materialCounts = await page.evaluate(() => ({
              legacy:{wood:Number(s.wood),crystal:Number(s.crystal),herbs:Number(s.herbs)},
              newMaterials:Object.keys(s.craftingMaterials || {}).sort(),
              allNonNegative:QI_CRAFTING_MATERIALS.every(item => {
                const n=item.key==='wood'?s.wood:item.key==='crystal'?s.crystal:item.key==='qiHerb'?s.herbs:s.craftingMaterials[item.key];
                return Number.isFinite(Number(n)) && Number(n)>=0;
              })
            }));
            if (!materialCounts.allNonNegative || JSON.stringify(materialCounts.newMaterials) !== JSON.stringify(['beastBone','beastHide','cloth','iron','talismanPaper'])) throw new Error('材料數量或存檔欄位不正確：' + JSON.stringify(materialCounts));
            await bag.locator('[data-bag-main-tab="equipment"]').click();
            console.log('Qi Refining materials regression passed: eight stacked material types, legacy resources reused without reset, and material inventory view.');

            // v2.7 regression: all twelve Qi Refining recipes render, insufficient materials never consume resources, and successful crafting deducts the exact recipe and adds gear.
            const forgeRecipeAudit = await page.evaluate(() => {
              const snapshot = JSON.parse(JSON.stringify(s));
              try {
                renderQiRecipeCards();
                const rendered = document.querySelectorAll('#qiStarterRecipes .qi-recipe-card').length;
                s.craftingMaterials = {iron:0,cloth:0,beastHide:0,beastBone:0,talismanPaper:0};
                s.wood = 0; s.crystal = 0; s.herbs = 0;
                const beforeInsufficient = JSON.stringify({inventory:s.inventory,materials:s.craftingMaterials,wood:s.wood,crystal:s.crystal,herbs:s.herbs});
                const denied = craftQiGear('護身軟甲');
                const afterInsufficient = JSON.stringify({inventory:s.inventory,materials:s.craftingMaterials,wood:s.wood,crystal:s.crystal,herbs:s.herbs});
                s.craftingMaterials.iron = 2;
                s.craftingMaterials.beastBone = 1;
                const beforeCount = s.inventory.filter(item => item.name === '精鐵劍').length;
                const beforeIron = s.craftingMaterials.iron;
                const beforeBone = s.craftingMaterials.beastBone;
                const crafted = craftQiGear('精鐵劍');
                const afterCount = s.inventory.filter(item => item.name === '精鐵劍').length;
                return {
                  rendered,
                  insufficientDenied: denied === false,
                  insufficientNoCost: beforeInsufficient === afterInsufficient,
                  crafted,
                  addedExactlyOne: afterCount === beforeCount + 1,
                  ironConsumedExactly: beforeIron - s.craftingMaterials.iron === 2,
                  boneConsumedExactly: beforeBone - s.craftingMaterials.beastBone === 1
                };
              } finally {
                s = Object.assign(base(), snapshot);
                render();
              }
            });
            if (forgeRecipeAudit.rendered !== 12 || !forgeRecipeAudit.insufficientDenied || !forgeRecipeAudit.insufficientNoCost ||
                !forgeRecipeAudit.crafted || !forgeRecipeAudit.addedExactlyOne || !forgeRecipeAudit.ironConsumedExactly || !forgeRecipeAudit.boneConsumedExactly) {
              throw new Error('煉器配方製作回歸測試失敗：' + JSON.stringify(forgeRecipeAudit));
            }
            console.log('Qi Refining forge regression passed: twelve recipes, insufficient-material protection, exact resource costs and crafted gear entering inventory.');

            // v2.7 regression: enhancement requires both spirit stones and the matching material, and consumes them only on success.
            const enhancementMaterialAudit = await page.evaluate(() => {
              const snapshot = JSON.parse(JSON.stringify(s));
              try {
                const template = gears.find(item => item.qiStarter && item.name === '精鐵劍');
                s.inventory = [{...template,id:987654321,enhanceLevel:0,atk:3,def:0,hp:0}];
                s.gold = 1000;
                s.craftingMaterials = {iron:0,cloth:0,beastHide:0,beastBone:0,talismanPaper:0};
                s.wood = 0; s.crystal = 0; s.herbs = 0;
                const item = s.inventory[0];
                const goldBeforeDenied = s.gold;
                const denied = enhanceGear(item.id);
                const deniedSafe = item.enhanceLevel === 0 && s.gold === goldBeforeDenied && s.craftingMaterials.iron === 0;
                s.craftingMaterials.iron = 1;
                const goldBefore = s.gold, atkBefore = item.atk, cost = gearEnhanceCost(item);
                const material = gearEnhanceMaterial(item);
                enhanceGear(item.id);
                return {
                  deniedWithoutMaterial: deniedSafe,
                  materialMapped: material.key === 'iron' && material.amount === 1,
                  levelRaised: item.enhanceLevel === 1,
                  goldConsumedExactly: goldBefore - s.gold === cost,
                  materialConsumedExactly: s.craftingMaterials.iron === 0,
                  statsRaised: item.atk === atkBefore + 2
                };
              } finally {
                s = Object.assign(base(), snapshot);
                render();
              }
            });
            if (!enhancementMaterialAudit.deniedWithoutMaterial || !enhancementMaterialAudit.materialMapped ||
                !enhancementMaterialAudit.levelRaised || !enhancementMaterialAudit.goldConsumedExactly ||
                !enhancementMaterialAudit.materialConsumedExactly || !enhancementMaterialAudit.statsRaised) {
              throw new Error('裝備強化材料回歸測試失敗：' + JSON.stringify(enhancementMaterialAudit));
            }
            console.log('Equipment enhancement material regression passed: missing-material protection, exact spirit-stone and iron costs, and expected stat growth.');

            // v2.7 regression: the real single-item dismantle confirmation returns material and keeps the spirit-stone reward.
            const dismantleMaterialAudit = await page.evaluate(async () => {
              const snapshot = JSON.parse(JSON.stringify(s));
              try {
                const template = gears.find(item => item.qiStarter && item.name === '精鐵劍');
                s.inventory = [{...template,id:987654322,enhanceLevel:0,atk:3,def:0,hp:0,locked:false}];
                s.equipped = {weapon:null,armor:null,charm:null};
                s.gearProtection = {qualityEnabled:false,starEnabled:false,enhanceEnabled:false};
                s.gold = 0;
                s.craftingMaterials = {iron:0,cloth:0,beastHide:0,beastBone:0,talismanPaper:0};
                s.wood = 0; s.crystal = 0; s.herbs = 0;
                const beforeGold = s.gold;
                window.bagReviewDismantle(987654322);
                await new Promise(resolve => setTimeout(resolve, 20));
                const confirm = document.getElementById('bagConfirmSingleDismantle');
                if (!confirm) throw new Error('找不到單件分解確認按鈕');
                confirm.click();
                await new Promise(resolve => setTimeout(resolve, 20));
                return {
                  removedItem: !s.inventory.some(item => item.id === 987654322),
                  returnedMatchingMaterial: s.craftingMaterials.iron === 1,
                  grantedSpiritStones: s.gold > beforeGold
                };
              } finally {
                s = Object.assign(base(), snapshot);
                render();
              }
            });
            if (!dismantleMaterialAudit.removedItem || !dismantleMaterialAudit.returnedMatchingMaterial || !dismantleMaterialAudit.grantedSpiritStones) {
              throw new Error('裝備分解材料回收回歸測試失敗：' + JSON.stringify(dismantleMaterialAudit));
            }
            console.log('Equipment dismantle material regression passed: single-item confirmation removes gear, returns matching material, and preserves spirit-stone reward.');



            // v2.7 regression: validate the 12 Qi Refining starter items and prevent duplicate drops.
            const starterGearAudit = await page.evaluate(() => {
              const expected = [
                ['精鐵劍','weapon'],['青竹劍','weapon'],['烏木法杖','weapon'],
                ['粗布道袍','armor'],['青紋法衣','armor'],['護身軟甲','armor'],
                ['凝氣玉佩','charm'],['聚靈手環','ring'],['鐵木護腕','ring'],
                ['低階攻擊符','charm'],['護身靈符','charm'],['聚氣靈珠','charm']
              ];
              const items = gears.filter(item => item.qiStarter);
              const byName = new Map(items.map(item => [item.name,item]));
              const missing = expected.filter(([name]) => !byName.has(name)).map(([name]) => name);
              const wrongSlots = expected.filter(([name,slot]) => byName.has(name) && byName.get(name).slot !== slot).map(([name,slot]) => ({name,expected:slot,actual:byName.get(name).slot}));
              const invalid = items.filter(item => !['凡品','靈品','珍品'].includes(item.rarity) ||
                ![item.atk,item.def,item.hp,item.value].every(value => Number.isFinite(Number(value)) && Number(value) >= 0) ||
                !String(item.desc || '').includes('【遊戲自創】')).map(item => item.name);
              const dropPool = items.filter(item => !s.inventory.some(owned => owned.name === item.name));
              const ownedStarterNames = s.inventory.filter(item => item.qiStarter).map(item => item.name);
              return {
                count:items.length, uniqueNames:byName.size, missing, wrongSlots, invalid,
                dropPoolNames:dropPool.map(item => item.name),
                ownedStarterNames,
                poolExcludesOwned:dropPool.every(item => !s.inventory.some(owned => owned.name === item.name))
              };
            });
            if (starterGearAudit.count !== 12 || starterGearAudit.uniqueNames !== 12 ||
                starterGearAudit.missing.length || starterGearAudit.wrongSlots.length || starterGearAudit.invalid.length ||
                !starterGearAudit.poolExcludesOwned) {
              throw new Error('煉氣期 12 件裝備資料或避免重複掉落檢查失敗：' + JSON.stringify(starterGearAudit));
            }
            console.log('Qi Refining starter gear regression passed: all 12 items, slots, existing rarity/stat schema, original-content labels and duplicate-drop prevention.');

            // v2.7 canon archive regression: four source-grounded entries live in the existing catalog.
            await bag.locator('.bag-catalog-button').click();
            const catalogModal = page.locator('#uiModal');
            await catalogModal.waitFor({ state: 'visible', timeout: 3000 });
            const catalogInitialText = await page.locator('#modalBody').innerText();
            if (!catalogInitialText.includes('原著典藏') || !catalogInitialText.includes('第一篇：裝備與寶物') || !catalogInitialText.includes('金蚨子母刃')) {
              throw new Error('既有分類圖鑑沒有顯示第一篇原著典藏與首項條目。');
            }
            const loreSummary = page.locator('#modalBody details summary');
            if (await loreSummary.count() !== 4) throw new Error('v2.7 原著典藏應有四個可展開條目。');
            const loreChecks = [
              { index: 0, name: '金蚨子母刃', required: ['母刃一把、子刃八把', '持有者／取得', '小說與動畫差異', '遊戲處理'] },
              { index: 1, name: '玄鐵飛天盾', required: ['防禦型法器', '自動飛行防禦', '第 163 章', '遊戲處理'] },
              { index: 2, name: '天雷子', required: ['一次性攻擊用寶物', '天地雷電', '第 163 章', '遊戲處理'] },
              { index: 3, name: '金光磚符寶', required: ['符寶', '第 164 章', '遊戲處理'] }
