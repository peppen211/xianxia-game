name: Deploy Playable Game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'prototype/**'
      - '.github/workflows/deploy-prototype-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install prototype dependencies
        working-directory: prototype
        run: npm install
      - name: Run prototype unit tests
        working-directory: prototype
        run: npm test
      - name: Build prototype
        working-directory: prototype
        run: npm run build
      - name: Prepare standalone playable entry
        run: |
          mkdir -p deploy
          cp index.html deploy/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
