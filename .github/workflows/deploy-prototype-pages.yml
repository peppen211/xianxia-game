name: Test and Deploy Full RPG to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run gameplay tests
        run: npm test
      - name: Build production site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published game entry
        run: |
          set -eu
          URL="https://peppen211.github.io/xianxia-game/"
          for attempt in 1 2 3 4 5 6; do
            PAGE="$(curl -fsSL "$URL" || true)"
            if printf "%s" "$PAGE" | grep -q "不好意思，本座又突破了" && printf "%s" "$PAGE" | grep -q "assets/index-"; then
              echo "Published Vite game entry verified."
              exit 0
            fi
            sleep 10
          done
          echo "Published page does not appear to be the built Vite game. Check GitHub Pages Source setting." >&2
          exit 1
