name: Test and Deploy Full RPG to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run gameplay tests
        run: npm test
      - name: Build production site
        run: |
          npm run build
          cp latest.html dist/latest.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser smoke-test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify game renders and starts in a mobile browser
        run: |
          cat > /tmp/game-smoke.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
            const errors = [];
            page.on('pageerror', error => { errors.push(error.message); console.log('BROWSER PAGE ERROR: ' + error.stack); });
            page.on('console', message => { if (message.type() === 'error') { errors.push(message.text()); console.log('BROWSER CONSOLE ERROR: ' + message.text()); } });
            page.on('requestfailed', request => console.log('FAILED REQUEST: ' + request.url() + ' :: ' + request.failure()?.errorText));
            page.on('response', response => { if (response.status() >= 400) console.log('HTTP ERROR: ' + response.status() + ' ' + response.url()); });
            let rendered = false;
            for (let attempt = 0; attempt < 6; attempt++) {
              await page.goto('https://peppen211.github.io/xianxia-game/', { waitUntil: 'domcontentloaded', timeout: 60000 });
              try {
                await page.locator('#hero').waitFor({ timeout: 8000 });
                rendered = true;
                break;
              } catch {
                console.log('Waiting for published app, attempt ' + (attempt + 1) + '; title=' + await page.title() + '; body=' + (await page.locator('body').innerText()).slice(0, 300) + '; errors=' + errors.join(' | '));
                await page.waitForTimeout(5000);
              }
            }
            if (!rendered) throw new Error('Published game UI did not render after retries.');
            await page.getByRole('button', { name: '開始修仙' }).click();
            await page.getByRole('button', { name: '修煉' }).waitFor({ timeout: 10000 });
            if (errors.length) throw new Error('Browser console errors: ' + errors.join(' | '));
            console.log('Mobile browser smoke test passed: standalone game rendered, start button worked, and cultivation action was clickable.');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          EOF
          node /tmp/game-smoke.cjs
      - name: Verify published game entry
        run: |
          set -eu
          URL="https://peppen211.github.io/xianxia-game/"
          for attempt in 1 2 3 4 5 6; do
            PAGE="$(curl -fsSL "$URL" || true)"
            if printf "%s" "$PAGE" | grep -q 'id="start"' && printf "%s" "$PAGE" | grep -q 'id="cultivateBtn"' && ! printf "%s" "$PAGE" | grep -q '/src/main.tsx'; then
              echo "Published standalone game entry and core controls verified."
              exit 0
            fi
            sleep 10
          done
          echo "Published page or one of its compiled assets failed verification. Check GitHub Pages source and asset paths." >&2
          exit 1
