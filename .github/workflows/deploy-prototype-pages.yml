name: Test and Deploy Full RPG to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run gameplay tests
        run: npm test
      - name: Build production site
        run: |
          npm run build
          cp latest.html dist/latest.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser smoke-test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify game renders and starts in a mobile browser
        run: |
          cat > /tmp/game-smoke.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
            await page.goto('https://peppen211.github.io/xianxia-game/', { waitUntil: 'networkidle', timeout: 60000 });
            await page.getByRole('heading', { name: '不好意思，本座又突破了' }).waitFor({ timeout: 15000 });
            await page.getByRole('button', { name: '開始修仙' }).click();
            await page.getByRole('button', { name: '修煉' }).waitFor({ timeout: 10000 });
            if (errors.length) throw new Error('Browser console errors: ' + errors.join(' | '));
            console.log('Mobile browser smoke test passed: landing screen rendered and cultivation button became available.');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          EOF
          node /tmp/game-smoke.cjs
      - name: Verify published game entry
        run: |
          set -eu
          URL="https://peppen211.github.io/xianxia-game/"
          for attempt in 1 2 3 4 5 6; do
            PAGE="$(curl -fsSL "$URL" || true)"
            JS_PATH="$(printf "%s" "$PAGE" | grep -oE '/xianxia-game/assets/index-[^" ]+\.js' | head -n 1 || true)"
            CSS_PATH="$(printf "%s" "$PAGE" | grep -oE '/xianxia-game/assets/index-[^" ]+\.css' | head -n 1 || true)"
            if printf "%s" "$PAGE" | grep -q "不好意思，本座又突破了" && [ -n "$JS_PATH" ] && [ -n "$CSS_PATH" ]; then
              JS_CODE="$(curl -fsSL "https://peppen211.github.io$JS_PATH" || true)"
              CSS_CODE="$(curl -fsSL "https://peppen211.github.io$CSS_PATH" || true)"
              if [ -n "$JS_CODE" ] && [ -n "$CSS_CODE" ] && printf "%s" "$JS_CODE" | grep -q "仙途再啟"; then
                echo "Published Vite entry, JavaScript bundle, CSS bundle, and expected game UI verified."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Published page or one of its compiled assets failed verification. Check GitHub Pages source and asset paths." >&2
          exit 1
