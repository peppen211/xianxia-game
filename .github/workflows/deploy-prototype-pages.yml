name: Test and Deploy Full RPG to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run gameplay tests
        run: npm test
      - name: Build production site
        run: |
          npm run build
          cp index.html dist/index.html
          cp latest.html dist/latest.html
          cp '首頁.PNG' 'dist/首頁.PNG'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser smoke-test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify launch gate and entry flow in a mobile browser
        run: |
          cat > /tmp/game-smoke.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, reducedMotion: 'reduce' });
            const errors = [];
            page.on('pageerror', error => { errors.push(error.message); console.log('BROWSER PAGE ERROR: ' + error.stack); });
            page.on('console', message => { if (message.type() === 'error') { errors.push(message.text()); console.log('BROWSER CONSOLE ERROR: ' + message.text()); } });
            page.on('response', response => { if (response.status() >= 400) console.log('BROWSER HTTP ERROR: ' + response.status() + ' ' + response.url()); });
            page.on('requestfailed', request => console.log('BROWSER REQUEST FAILED: ' + request.url() + ' :: ' + (request.failure()?.errorText || 'unknown')));

            await page.goto('https://peppen211.github.io/xianxia-game/?v=0.54', { waitUntil: 'domcontentloaded', timeout: 60000 });
            const gate = page.locator('#launchGate');
            const app = page.locator('#gameApp');
            const continueButton = page.locator('#continueCultivationBtn');

            await gate.waitFor({ state: 'visible', timeout: 15000 });
            await continueButton.waitFor({ state: 'visible', timeout: 5000 });
            const launchLabel = (await continueButton.locator('.continue-label').innerText().catch(() => continueButton.innerText())).trim();
            if (!['繼續修煉', '開始修行'].includes(launchLabel)) {
              throw new Error('Launch gate button label is missing or incorrect: ' + launchLabel);
            }
            if (await app.isVisible()) throw new Error('Main game is visible before the player enters.');
            if (!(await page.locator('body').evaluate(el => el.classList.contains('launch-gate')))) {
              throw new Error('Fresh page did not start in launch-gate state.');
            }

            await continueButton.click();
            await app.waitFor({ state: 'visible', timeout: 5000 });
            await gate.waitFor({ state: 'hidden', timeout: 5000 });
            if (await page.locator('body').evaluate(el => el.classList.contains('launch-gate'))) {
              throw new Error('Launch-gate state remained after clicking continue.');
            }
            const characterHeadingDisplay = await page.locator('#character > .page-title').evaluate(el => getComputedStyle(el).display);
            if (characterHeadingDisplay !== 'none') throw new Error('角色分頁的「修士面板」標題列應已移除。');
            const cultivationHeadingDisplay = await page.locator('#cultivate > .page-title').evaluate(el => getComputedStyle(el).display);
            if (cultivationHeadingDisplay !== 'none') throw new Error('修煉分頁的「修煉洞府」標題列應已移除。');

            // Mobile regression checks for cultivation content.
            const methodCards = page.locator('#cultivate #methodList > .method-card');
            await methodCards.first().waitFor({ state: 'visible', timeout: 5000 });
            if (await methodCards.count() !== 3) throw new Error('Expected three cultivation method cards to be visible.');
            if (!(await page.locator('#breakMaterialSummary').isVisible())) throw new Error('Breakthrough material requirements are missing.');
            if (!(await page.locator('#idleProgressPanel').isVisible())) throw new Error('Idle cultivation progress panel is missing.');
            if (await page.locator('#cultivate > .hero .cultivator').isVisible()) throw new Error('Legacy cultivation illustration should be hidden in the compact guide.');

            await methodCards.first().locator('.method-details-button').click();
            const modal = page.locator('#uiModal');
            await modal.waitFor({ state: 'visible', timeout: 5000 });
            if (!(await page.locator('#modalBody').innerText()).includes('實際效果')) throw new Error('Method detail content did not open.');
            await page.locator('#uiModal .modal-close').click();
            await modal.waitFor({ state: 'hidden', timeout: 3000 });

            await page.locator('#breakBtn').click();
            await modal.waitFor({ state: 'visible', timeout: 5000 });
            const breakthroughText = await page.locator('#modalBody').innerText();
            if (!breakthroughText.includes('靈石') || !breakthroughText.includes('靈草')) throw new Error('Breakthrough dialog must show required materials.');
            await page.locator('#uiModal .modal-close').click();
            await modal.waitFor({ state: 'hidden', timeout: 3000 });

            // Regression checks for v0.97 equipment inventory. Fixtures exist only in this isolated CI browser profile.
            await page.locator('#gameApp .bottom .nav[data-screen="bag"]').click();
            const bag = page.locator('#bag');
            const mainTabs = bag.locator('[data-bag-main-tab]');
            const equipTabs = bag.locator('[data-bag-category]');
            if (await mainTabs.count() !== 3) throw new Error('儲物袋應有裝備類、古寶類、靈寵類三個主分類。');
            if (await equipTabs.count() !== 4) throw new Error('裝備分類應有全部、武器、防具、飾品四個子分類。');
            await page.evaluate(() => {
              const fixtures = [
                {id:9901001,name:'測試已穿戴法器',slot:'weapon',rarity:'凡品',stars:1,enhanceLevel:0,atk:2,def:1,hp:1,value:15,icon:'劍',catalogType:'法器',catalogClass:'裝備類'},
                {id:9901002,name:'測試靈品法器',slot:'weapon',rarity:'靈品',stars:2,enhanceLevel:0,atk:8,def:2,hp:4,value:50,icon:'劍',catalogType:'法器',catalogClass:'裝備類'},
                {id:9901003,name:'測試批次分解防具',slot:'armor',rarity:'凡品',stars:1,enhanceLevel:0,atk:0,def:3,hp:8,value:15,icon:'甲',catalogType:'法器',catalogClass:'裝備類'},
                {id:9901004,name:'測試法寶',slot:'ring',rarity:'珍品',stars:2,enhanceLevel:0,atk:4,def:1,hp:3,value:80,icon:'環',catalogType:'法寶',catalogClass:'裝備類'}
              ];
              s.inventory = s.inventory.filter(item => !fixtures.some(testItem => testItem.id === item.id));
              s.inventory.push(...fixtures);
              s.equipped.weapon = 9901001;
              s.gearProtection = {qualityEnabled:true,minQuality:3,starEnabled:true,minStars:4};
              render();
            });
            const scrollModel = await bag.evaluate(el => ({ screenOverflowY: getComputedStyle(el).overflowY, itemOverflowY: getComputedStyle(el.querySelector('#inventory')).overflowY }));
            if (scrollModel.screenOverflowY !== 'hidden' || scrollModel.itemOverflowY !== 'auto') throw new Error('儲物袋應固定外框，只有物品格清單可捲動：' + JSON.stringify(scrollModel));
            const bagGeometry = await bag.evaluate(el => { const rect=n=>{if(!n)return {id:'',cls:'',x:0,y:0,w:0,h:0,display:'missing',overflowY:'hidden',flex:'none',gridRows:'',gridCols:''};const r=n.getBoundingClientRect();const c=getComputedStyle(n);return {id:n.id||'',cls:typeof n.className==='string'?n.className:'',x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),display:c.display,overflowY:c.overflowY,flex:c.flex,gridRows:c.gridTemplateRows,gridCols:c.gridTemplateColumns};};return {screen:rect(el),equipment:rect(el.querySelector('#bagEquipmentView')),gear:rect(el.querySelector('.bag-gear-layout')),slots:rect(el.querySelector('.bag-slots-panel')),listPanel:rect(el.querySelector('.bag-list-panel')),inventory:rect(el.querySelector('#inventory')),tile:rect(el.querySelector('.bag-item-tile[aria-label="比較：測試靈品法器"]')),footer:rect(el.querySelector('.bag-footer-actions')),pill:rect(el.querySelector('.bag-pill-bar'))};});
            if (bagGeometry.equipment.h < 250 || bagGeometry.listPanel.h < 100 || bagGeometry.inventory.h < 80) {
              throw new Error('儲物袋版面尺寸不正確：' + JSON.stringify(bagGeometry));
            }
            if (bagGeometry.listPanel.h < bagGeometry.slots.h * 1.5) {
              throw new Error('全部裝備清單未充分延伸：' + JSON.stringify(bagGeometry));
            }
            if (bagGeometry.listPanel.y + bagGeometry.listPanel.h > bagGeometry.footer.y + 2) {
              throw new Error('全部裝備區塊侵入底部操作列：' + JSON.stringify(bagGeometry));
            }
            if (bagGeometry.footer.y + bagGeometry.footer.h > bagGeometry.screen.y + bagGeometry.screen.h + 2) {
              throw new Error('底部操作列超出儲物袋外框：' + JSON.stringify(bagGeometry));
            }
            const gridColumns = await bag.locator('#inventory').evaluate(el => getComputedStyle(el).gridTemplateColumns.split(/\s+/).filter(Boolean).length);
            if (gridColumns !== 4) throw new Error('裝備清單不是四欄物品格。');
            await bag.getByRole('button', {name:/比較：測試靈品法器/}).click({timeout:5000});
            const equipmentModal = page.locator('#uiModal');
            await equipmentModal.waitFor({state:'visible',timeout:3000});
            const comparisonText = await page.locator('#modalBody').innerText();
            if (!comparisonText.includes('測試已穿戴法器') || !comparisonText.includes('測試靈品法器') || !comparisonText.includes('差值')) {
              throw new Error('裝備比較未顯示目前裝備、候選裝備及屬性差值。');
            }
            const comparisonActions = page.locator('#modalBody .bag-compare-actions button');
            if (await comparisonActions.count() !== 5) {
              throw new Error('裝備比較彈窗應保留確認穿戴、強化、鎖定、分解與返回背包五項操作。實際按鈕數：' + await comparisonActions.count());
            }
            for (const actionId of ['bagEquipConfirm', 'bagEnhanceConfirm', 'bagLockConfirm', 'bagDismantleConfirm', 'bagEquipBack']) {
              if (await page.locator('#modalBody #' + actionId).count() !== 1) {
                throw new Error('裝備比較彈窗缺少必要操作：' + actionId);
              }
            }
            await page.locator('#bagEquipConfirm').click();
            await equipmentModal.waitFor({state:'hidden',timeout:3000});
            if (!(await page.evaluate(() => s.equipped.weapon === 9901002))) throw new Error('比較彈窗確認穿戴沒有更新目前武器。');
            if (await page.locator('#bagSlotsToggle').count() !== 0) throw new Error('目前穿戴區不應再顯示收起控制。');
            if (await page.locator('#slots').evaluate(el => el.hidden)) throw new Error('目前穿戴欄應維持顯示。');
            await page.locator('#bagTypeFilter').selectOption('法寶');
            const filteredByType = await page.locator('#inventory').innerText();
            if (!filteredByType.includes('測試法寶') || filteredByType.includes('測試批次分解防具')) throw new Error('器物種類篩選未正確篩出法寶。');
            await page.locator('#bagTypeFilter').selectOption('all');
            await bag.locator('[data-bag-main-tab="treasures"]').click();
            if (await page.locator('#bagInactiveCategory .bag-treasure-card').count() !== 4) throw new Error('古寶頁應顯示四件可收藏古寶。');
            await bag.locator('[data-bag-main-tab="pets"]').click();
            if (!(await page.locator('#bagInactiveCategory').innerText()).includes('靈寵類')) throw new Error('靈寵類暫未開放提示缺失。');
            await bag.locator('[data-bag-main-tab="equipment"]').click();
            await page.locator('#bagBatchToggle').click();
            const armorCheckbox = page.locator('#inventory .bag-select-check[aria-label="選取 測試批次分解防具"]');
            await armorCheckbox.waitFor({state:'visible',timeout:3000});
            await armorCheckbox.check();
            await page.locator('#bagBatchReview').click();
            await equipmentModal.waitFor({state:'visible',timeout:3000});
            if (!(await page.locator('#modalBody').innerText()).includes('測試批次分解防具')) throw new Error('批次分解確認清單未列出所選裝備。');
            await page.locator('#bagConfirmBatch').click();
            await equipmentModal.waitFor({state:'hidden',timeout:3000});
            if (await page.evaluate(() => s.inventory.some(item => item.id === 9901003))) throw new Error('確認批次分解後，所選測試防具仍在背包。');
            console.log('Equipment inventory v0.97 regression passed: four-column grid, compare/equip modal, slot collapse, type filter, placeholders, and batch dismantle.');

            // Ancient treasure regression: fragments drop only from battle, crafting spends fragments, and owned effects activate without equipment slots.
            await bag.locator('[data-bag-main-tab="treasures"]').click();
            const treasureCards = bag.locator('#bagInactiveCategory .bag-treasure-card');
            if (await treasureCards.count() !== 4) throw new Error('古寶類應顯示四件可收藏古寶。');
            const fragmentsBefore = await page.evaluate(() => Number(s.treasureFragments['guiding-jade'] || 0));
            await page.evaluate(() => {
              const oldRandom = Math.random;
              try {
                Math.random = () => 0;
                for (let i = 0; i < 2; i++) {
                  enemy = { type: '首領', name: '測試古寶首領', gold: 10, xp: 2, def: 0 };
                  win();
                }
                render();
              } finally { Math.random = oldRandom; }
            });
            const fragmentsAfterDrop = await page.evaluate(() => Number(s.treasureFragments['guiding-jade'] || 0));
            if (fragmentsAfterDrop < fragmentsBefore + 3) throw new Error('首領戰鬥沒有可靠地增加古寶碎片。');
            const bonusXpBeforeTreasure = await page.evaluate(() => gearPerks().bonusXp);
            const fragmentsBeforeCraft = fragmentsAfterDrop;
            await bag.locator('[data-treasure-action="guiding-jade"]').click({timeout:5000});
            const treasureStateAfterCraft = await page.evaluate(() => ({
              owned: (s.ownedTreasures || []).find(item => item.id === 'guiding-jade'),
              fragments: Number(s.treasureFragments['guiding-jade'] || 0),
              bonusXp: gearPerks().bonusXp
            }));
            if (!treasureStateAfterCraft.owned || treasureStateAfterCraft.owned.level !== 1) throw new Error('古寶碎片合成未新增持有紀錄。');
            if (treasureStateAfterCraft.fragments !== fragmentsBeforeCraft - 3) throw new Error('合成古寶未正確扣除所需碎片。');
            if (treasureStateAfterCraft.bonusXp < bonusXpBeforeTreasure + 0.014) throw new Error('持有引靈古玉後，修為被動效果沒有生效。');
            console.log('Ancient treasure regression passed: boss fragment drops, synthesis cost, owned collection state, passive XP bonus, and automatic save.');


           
            // Regression checks for the fifth tab: no duplicate database action or unrelated save/reward cards.
            await page.locator('#gameApp .bottom .nav[data-screen="journal"]').click();
            const arcCards = page.locator('#journalHybridStages .journal-arc-card');
            if (await arcCards.count() !== 8) throw new Error('仙途分頁應顯示八大主線階段。');
            const journalText = await page.locator('#journalV14Dock').innerText();
            if (journalText.includes('存檔安全') || journalText.includes('放置收益')) throw new Error('仙途分頁仍包含不屬於主線紀事的功能卡。');
            if (await page.locator('#journalV14Dock #openNodeDatabase').count()) throw new Error('仙途分頁仍有重複的整份紀事資料庫按鈕。');
            const firstArcButton = arcCards.nth(0).locator('.journal-arc-toggle');
            const firstArcContent = arcCards.nth(0).locator('.journal-arc-content');
            if ((await firstArcButton.getAttribute('aria-expanded')) === 'true') await firstArcButton.click();
            if ((await firstArcButton.getAttribute('aria-expanded')) !== 'false' || await firstArcContent.isVisible()) throw new Error('單一主線階段收合按鈕未生效。');
            await firstArcButton.click();
            if ((await firstArcButton.getAttribute('aria-expanded')) !== 'true' || !(await firstArcContent.isVisible())) throw new Error('單一主線階段展開按鈕未生效。');
            // v0.96 renders node details expanded by default; verify the current node card and its unlock/map metadata instead of the removed legacy toggle.
            const nodeCard = page.locator('#journalHybridStages .journal-node-card').first();
            await nodeCard.waitFor({state:'visible', timeout:3000});
            const nodeCardText = await nodeCard.innerText();
            if (!nodeCardText.includes('故事地點：') || !nodeCardText.includes('解鎖條件：')) throw new Error('主線節點未顯示故事地點與解鎖條件。');
            if (await page.locator('#toggleJournalStages').count()) throw new Error('進度總覽仍有全部展開／收起按鈕。');
            const secondArcButton = arcCards.nth(1).locator('.journal-arc-toggle');
            const secondArcContent = arcCards.nth(1).locator('.journal-arc-content');
            if ((await secondArcButton.getAttribute('aria-expanded')) !== 'true') await secondArcButton.click();
            if (!(await secondArcContent.isVisible())) throw new Error('第二階段無法展開。');
            if ((await firstArcButton.getAttribute('aria-expanded')) !== 'true' || !(await firstArcContent.isVisible())) throw new Error('章節應獨立展開，開啟第二階段不可收起第一階段。');
            await secondArcButton.click();
            if ((await secondArcButton.getAttribute('aria-expanded')) !== 'false' || await secondArcContent.isVisible()) throw new Error('第二階段無法獨立收合。');
            if ((await firstArcButton.getAttribute('aria-expanded')) !== 'true' || !(await firstArcContent.isVisible())) throw new Error('收合第二階段時，第一階段受到連動影響。');
            await secondArcButton.click();
            if (!(await firstArcContent.isVisible()) || !(await secondArcContent.isVisible())) throw new Error('再次展開第二階段後，兩個章節應可同時展開。');
            console.log('Journal UI regression passed: eight stages, independent expand/collapse, no bulk toggle or unrelated cards.');
            // Current v0.96+ story flow uses one central story-library entry and renders chapter nodes as expanded cards.
            const storyLibraryButton = page.locator('#journalStoryLibraryButton');
            if (!(await storyLibraryButton.isVisible())) throw new Error('中央「修仙劇情故事」入口不可見。');
            const secondStageLockNote = arcCards.nth(1).locator('.journal-stage-lock-note');
            if (!(await secondStageLockNote.textContent()).includes('黃楓谷')) throw new Error('第二階段未顯示境界／地圖解鎖條件。');

            await storyLibraryButton.click();
            const novelReader = page.locator('#modalBody .novel-reader');
            await novelReader.waitFor({ state: 'visible', timeout: 3000 });
            if (await novelReader.locator('p').count() < 8) throw new Error('主線節點全文不足八個段落。');
            const readerText = await novelReader.innerText();
            if (readerText.length < 650) throw new Error('主線節點全文篇幅不足。');
            if (!readerText.includes('凡人起步・青牛鎮')) throw new Error('未開啟第一個可閱讀主線節點。');
            if (await novelReader.locator('.novel-chapter-nav button').count() !== 2) throw new Error('主線全文上一節／下一節導覽缺失。');

            const readerMode = await novelReader.evaluate(reader => {
              const el = reader.closest('.ui-modal');
              if (!el) throw new Error('小說閱讀器找不到所屬彈窗 .ui-modal。');
              const r = el.getBoundingClientRect();
              return { position: getComputedStyle(el).position, rect: { x:r.x, y:r.y, width:r.width, height:r.height } };
            });
            const viewport = page.viewportSize();
            if (readerMode.position !== 'fixed' || readerMode.rect.width < viewport.width - 2 || readerMode.rect.height < viewport.height - 2) throw new Error('小說閱讀器沒有覆蓋整個手機畫面。');
            const closeStoryFooter = page.locator('#uiModal.novel-reading-mode #modalFooter button');
            const topStoryClose = page.locator('#uiModal.novel-reading-mode .modal-close');
            if (!(await closeStoryFooter.isVisible()) || await topStoryClose.isVisible()) throw new Error('劇情閱讀模式應保留下方關閉按鈕並隱藏右上角重複按鈕。');
            await closeStoryFooter.click();
            await page.locator('#uiModal').waitFor({ state: 'hidden', timeout: 3000 });
            if (await page.locator('#journalHybridStages').isHidden()) throw new Error('關閉劇情後沒有返回仙途。');
            await storyLibraryButton.click();
            await novelReader.waitFor({ state: 'visible', timeout: 3000 });
            if (await page.locator('#uiModal.novel-reading-mode .modal-close').isVisible()) throw new Error('重新開啟劇情後右上角重複關閉按鈕再次出現。');
            await page.keyboard.press('Escape');
            await page.locator('#uiModal').waitFor({ state: 'hidden', timeout: 3000 });
            console.log('Story progression regression passed: central story entry, gated stage metadata, full chapter reader, immersive layout, close and reopen flow.');


            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.locator('#launchGate').waitFor({ state: 'visible', timeout: 15000 });
            await page.locator('#continueCultivationBtn').waitFor({ state: 'visible', timeout: 5000 });
            if (await page.locator('#gameApp').isVisible()) {
              throw new Error('Reload did not return to the launch home screen.');
            }
            const persistedSave = await page.evaluate(() => {
              const raw = localStorage.getItem('nine_heavens_idle_v2');
              if (!raw) throw new Error('重新載入後找不到既有存檔 nine_heavens_idle_v2。');
              const saved = JSON.parse(raw);
              const stableFields = [
                'major', 'layer', 'gold', 'herbs', 'kills', 'inventory', 'equipped',
                'ownedMethods', 'methodLevels', 'treasureFragments', 'ownedTreasures'
              ];
              const stable = Object.fromEntries(stableFields.map(key => [key, saved[key] ?? null]));
              return {
                keyExists: true,
                stable,
                hasFragmentMap: !!saved.treasureFragments && typeof saved.treasureFragments === 'object',
                owned: Array.isArray(saved.ownedTreasures) && saved.ownedTreasures.some(item => item.id === 'guiding-jade' && item.level === 1),
                hasSaveTimestamp: Number.isFinite(Number(saved.last)) && Number(saved.last) > 0
              };
            });
            if (!persistedSave.keyExists || !persistedSave.hasFragmentMap || !persistedSave.owned) throw new Error('重新載入後古寶碎片／收藏存檔沒有保留。');
            if (!persistedSave.hasSaveTimestamp) throw new Error('存檔時間戳遺失或無效。');
            const preReloadSave = await page.evaluate(() => {
              const saved = JSON.parse(localStorage.getItem('nine_heavens_idle_v2') || '{}');
              const stableFields = [
                'major', 'layer', 'gold', 'herbs', 'kills', 'inventory', 'equipped',
                'ownedMethods', 'methodLevels', 'treasureFragments', 'ownedTreasures'
              ];
              return Object.fromEntries(stableFields.map(key => [key, saved[key] ?? null]));
            });
            if (JSON.stringify(persistedSave.stable) !== JSON.stringify(preReloadSave)) {
              throw new Error('重新載入後核心存檔欄位與重載前不一致。');
            }
            console.log('Save persistence regression passed: realm, resources, inventory, equipment, methods, treasure fragments and owned treasures survive reload.');
            if (errors.length) throw new Error('Browser console errors: ' + errors.join(' | '));
            console.log('Mobile launch flow passed: visible continue button, enter game, and reload returns to home.');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          EOF
