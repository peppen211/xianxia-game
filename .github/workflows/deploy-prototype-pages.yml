      - name: Verify published game entry
        run: |
          set -eu
          URL="https://peppen211.github.io/xianxia-game/"
          for attempt in 1 2 3 4 5 6; do
            PAGE="$(curl -fsSL "$URL" || true)"
            LATEST_PAGE="$(curl -fsSL "${URL}latest.html" || true)"
            LEGACY_OK=1
            for LEGACY_PATH in classic.html mortal-cultivation-rpg.html mortal-cultivation-rpg-3.3.html prototype/index.html; do
              LEGACY_PAGE="$(curl -fsSL "${URL}${LEGACY_PATH}" || true)"
              if ! grep -Fq 'href="https://peppen211.github.io/xianxia-game/?v=1.21"' <<< "$LEGACY_PAGE" || ! grep -Fq 'location.replace' <<< "$LEGACY_PAGE"; then
                LEGACY_OK=0
              fi
            done
            if grep -Fq 'id="launchGate"' <<< "$PAGE" && grep -Fq 'id="continueCultivationBtn"' <<< "$PAGE" && grep -Fq 'id="gameApp"' <<< "$PAGE" && ! grep -Fq '/src/main.tsx' <<< "$PAGE" &&
               grep -Fq '<div class="version">v1.21</div>' <<< "$LATEST_PAGE" && grep -Fq 'href="./?v=1.21"' <<< "$LATEST_PAGE" && [ "$LEGACY_OK" -eq 1 ]; then
              echo "Published v1.21 entry, latest.html and all legacy redirects verified."
              exit 0
            fi
            sleep 10
          done
          echo "Published page or latest.html points to a stale game version. Check GitHub Pages source and asset paths." >&2
          exit 1
