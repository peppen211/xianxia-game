name: Test and Deploy Full RPG to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run gameplay tests
        run: npm test
      - name: Build production site
        run: |
          npm run build
          cp index.html dist/index.html
          cp latest.html dist/latest.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser smoke-test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify launch gate and entry flow in a mobile browser
        run: |
          cat > /tmp/game-smoke.cjs <<'EOF'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true, reducedMotion: 'reduce' });
            const errors = [];
            page.on('pageerror', error => { errors.push(error.message); console.log('BROWSER PAGE ERROR: ' + error.stack); });
            page.on('console', message => { if (message.type() === 'error') { errors.push(message.text()); console.log('BROWSER CONSOLE ERROR: ' + message.text()); } });

            await page.goto('https://peppen211.github.io/xianxia-game/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            const gate = page.locator('#launchGate');
            const app = page.locator('#gameApp');
            const continueButton = page.locator('#continueCultivationBtn');

            await gate.waitFor({ state: 'visible', timeout: 15000 });
            await continueButton.waitFor({ state: 'visible', timeout: 5000 });
            if ((await continueButton.innerText()).trim() !== '繼續修煉') {
              throw new Error('Launch gate button label is missing or incorrect.');
            }
            if (await app.isVisible()) throw new Error('Main game is visible before the player enters.');
            if (!(await page.locator('body').evaluate(el => el.classList.contains('launch-gate')))) {
              throw new Error('Fresh page did not start in launch-gate state.');
            }

            await continueButton.click();
            await app.waitFor({ state: 'visible', timeout: 5000 });
            await gate.waitFor({ state: 'hidden', timeout: 5000 });
            if (await page.locator('body').evaluate(el => el.classList.contains('launch-gate'))) {
              throw new Error('Launch-gate state remained after clicking continue.');
            }

            await page.reload({ waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.locator('#launchGate').waitFor({ state: 'visible', timeout: 15000 });
            await page.locator('#continueCultivationBtn').waitFor({ state: 'visible', timeout: 5000 });
            if (await page.locator('#gameApp').isVisible()) {
              throw new Error('Reload did not return to the launch home screen.');
            }
            if (errors.length) throw new Error('Browser console errors: ' + errors.join(' | '));
            console.log('Mobile launch flow passed: visible continue button, enter game, and reload returns to home.');
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          EOF
          node /tmp/game-smoke.cjs
      - name: Verify published game entry
        run: |
          set -eu
          URL="https://peppen211.github.io/xianxia-game/"
          for attempt in 1 2 3 4 5 6; do
            PAGE="$(curl -fsSL "$URL" || true)"
            if printf "%s" "$PAGE" | grep -q 'id="launchGate"' && printf "%s" "$PAGE" | grep -q 'id="continueCultivationBtn"' && printf "%s" "$PAGE" | grep -q 'id="gameApp"' && ! printf "%s" "$PAGE" | grep -q '/src/main.tsx'; then
              echo "Published standalone launch gate and game entry verified."
              exit 0
            fi
            sleep 10
          done
          echo "Published page or one of its compiled assets failed verification. Check GitHub Pages source and asset paths." >&2
          exit 1
