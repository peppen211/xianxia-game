name: Game Entry Pull Request Test

on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/game-entry-smoke.cjs'
      - '.github/workflows/game-entry-pr-test.yml'

permissions:
  contents: read

jobs:
  browser-regression:
    # Ubuntu 24.04 has a more mature Playwright dependency path than the newly
    # rolled-out 26.04 image, whose apt downloads timed out in the previous run.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Run project unit tests
        run: npm test
      - name: Build project
        run: npm run build
      - name: Install Playwright package
        run: npm install --no-save playwright
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1
      - name: Install Playwright system dependencies
        run: timeout 360s npx playwright install-deps chromium
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: timeout 360s npx playwright install chromium
      - name: Test current standalone game entry on mobile viewport
        run: node scripts/game-entry-smoke.cjs
