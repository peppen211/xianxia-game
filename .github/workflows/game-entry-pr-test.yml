name: Game Entry Pull Request Test

on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/game-entry-smoke.cjs'
      - '.github/workflows/game-entry-pr-test.yml'

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test current standalone game entry on mobile viewport
        run: node scripts/game-entry-smoke.cjs
